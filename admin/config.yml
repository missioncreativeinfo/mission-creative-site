backend:
  name: github
  repo: missioncreativeinfo/mission-creative-site
  branch: main
  base_url: https://api.netlify.com

media_folder: "uploads"
public_folder: "/uploads"

locale: "fr"

collections:
  - name: "catalogue"
    label: "Mes documents PDF"
    files:
      - name: "produits"
        label: "Catalogue de produits"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Documents à vendre"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options:
                  - "Jeux express"
                  - "Activités thématiques"
                  - "Outils du quotidien"
              - { label: "Prix (ex. 4,00 $)", name: "price", widget: "string", required: false }
              - { label: "Image du produit", name: "image", widget: "image", required: false }
              - { label: "Fichier PDF", name: "pdf", widget: "file", required: false }
              - { label: "Afficher sur le site", name: "published", widget: "boolean", default: true }

  - name: "contenu"
    label: "Textes du site"
    files:
      - name: "textes"
        label: "Modifier les textes"
        file: "data/site.json"
        format: "json"
        fields:
          - label: "Page d'accueil"
            name: "accueil"
            widget: "object"
            fields:
              - { label: "Petit texte", name: "surtitre", widget: "string" }
              - { label: "Titre principal", name: "titre", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Boutique"
            name: "boutique"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "À propos"
            name: "apropos"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Premier paragraphe", name: "paragraphe1", widget: "text" }
              - { label: "Deuxième paragraphe", name: "paragraphe2", widget: "text" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Message", name: "message", widget: "text" }
              - { label: "Texte du bouton", name: "bouton", widget: "string" }
              - { label: "Texte sous le formulaire", name: "note", widget: "string" }
              - { label: "Adresse courriel", name: "courriel", widget: "string" }
          - label: "Pied de page"
            name: "pied"
            widget: "object"
            fields:
              - { label: "Slogan", name: "slogan", widget: "string" }
